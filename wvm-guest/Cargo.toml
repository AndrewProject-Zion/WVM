[package]
name = "wvm-guest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WVM guest service: runs inside the Windows VM and executes control requests"

[[bin]]
name = "wvm-guest"
path = "src/main.rs"

[dependencies]
wvm-ipc = { path = "../wvm-ipc" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
# The `windows-service` crate owns the SCM conversation — StartServiceCtrlDispatcher, the control
# handler registration, and status reporting. Hand-rolling that against windows-sys would mean
# reproducing a well-specified state machine, and any mistake in it presents as a service that
# silently fails to start, which is the least debuggable failure mode there is.
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }
