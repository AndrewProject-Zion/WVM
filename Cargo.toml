[workspace]
resolver = "2"
members = ["wvm-ipc", "wvm-host", "wvm-guest"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AndrewProject-Zion/wvm"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[profile.release]
# Static-ish guest binary: no dynamic runtime to install inside a debloated guest.
lto = true
codegen-units = 1
panic = "abort"
strip = true
